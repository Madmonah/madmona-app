# GitHub Actions workflow: Process notification queue
#
# Calls /api/push/process-queue every 5 minutes with the CRON_SECRET
# to dispatch any queued notifications (e.g. from booking triggers).
#
# RESILIENCE: We retry once on transient failures (e.g. during Vercel
# deploys). Only persistent failures (≥2 consecutive non-200) fail the run.

name: Process Notification Queue

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  process-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call process-queue endpoint (with retry)
        run: |
          call_endpoint() {
            curl -sSL -w "\n%{http_code}" -X POST \
              "https://www.madmonacairo.com/api/push/process-queue" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -H "Content-Type: application/json" \
              --max-time 30
          }

          # First attempt
          response=$(call_endpoint)
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "Attempt 1 — Status: $status"
          echo "Body: $body"

          if [ "$status" = "200" ]; then
            echo "✅ Process queue success on first attempt"
            exit 0
          fi

          # Retry once (Vercel might be mid-deploy)
          echo "First attempt returned $status — waiting 15s and retrying once..."
          sleep 15
          response=$(call_endpoint)
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "Attempt 2 — Status: $status"
          echo "Body: $body"

          if [ "$status" = "200" ]; then
            echo "✅ Process queue success on retry"
            exit 0
          fi

          # Both attempts failed — issue warning but only fail on 5xx errors
          if [ "$status" -ge 500 ] 2>/dev/null; then
            echo "::error::Process queue persistently failing with $status — endpoint may be down"
            exit 1
          else
            echo "::warning::Process queue returned $status — likely transient (auth/deploy). Will retry next cycle."
            exit 0
          fi
