name: Deploy to Vercel (fallback)

# Fires when Vercel's git webhook doesn't trigger automatically.
# This is a FALLBACK — Vercel auto-deploys via git integration anyway.
# If the hook is missing/invalid, we log a warning but do NOT fail the run.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trigger-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        continue-on-error: true
        run: |
          HOOK="${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
          if [ -z "$HOOK" ]; then
            echo "::notice::No VERCEL_DEPLOY_HOOK_URL secret set. Skipping fallback (Vercel auto-deploys via git integration anyway)."
            exit 0
          fi
          echo "Triggering Vercel deploy hook..."
          # Note: NO -f flag — we don't fail on HTTP errors (fallback is non-critical)
          response=$(curl -sSL -w "\n%{http_code}" -X POST "$HOOK" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"${{ github.ref_name }}\",\"trigger\":\"github-action-fallback\"}")
          status=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | head -n -1)
          echo "Status: $status"
          echo "Body: $body"
          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "::warning::Deploy hook returned $status (non-fatal — Vercel auto-deploys via git anyway)"
          else
            echo "✅ Deploy hook fired successfully."
          fi

      - name: Log commit info
        if: always()
        run: |
          echo "Commit: ${{ github.sha }}"
          echo "Pushed by: ${{ github.actor }}"
          echo "Message: ${{ github.event.head_commit.message }}"
