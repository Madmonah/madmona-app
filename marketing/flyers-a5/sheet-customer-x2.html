<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  /* A4 portrait @300dpi = 2480x3508 — 2x A5 landscape stacked */
  body { width:2480px; height:3508px; background:#fff; position:relative; }
  .stack { width:100%; height:100%; display:grid; grid-template-rows:1fr 1fr; }
  .cell { position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .cell img { width:100%; height:100%; object-fit:contain; display:block; }
  .cut-h { position:absolute; left:0; right:0; top:50%; height:0; border-top:3px dashed #bbb; z-index:5; }
  .scissors { position:absolute; z-index:6; font-size:44px; color:#999; background:#fff; padding:2px 8px; border-radius:8px; top:calc(50% - 30px); left:16px; }
</style>
</head>
<body>
  <div class="stack">
    <div class="cell"><img src="A5-flyer-customer-landscape.png"></div>
    <div class="cell"><img src="A5-flyer-customer-landscape.png"></div>
  </div>
  <div class="cut-h"></div>
  <div class="scissors">✂️</div>
</body>
</html>
