<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  /* A4 @300dpi = 2480x3508 — 4x A6 quarters with cut guides */
  body { width:2480px; height:3508px; background:#fff; position:relative; }
  .grid { width:100%; height:100%; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }
  .cell { position:relative; overflow:hidden; }
  .cell img { width:100%; height:100%; object-fit:contain; display:block; }
  .cut-v { position:absolute; top:0; bottom:0; left:50%; width:0; border-left:3px dashed #bbb; z-index:5; }
  .cut-h { position:absolute; left:0; right:0; top:50%; height:0; border-top:3px dashed #bbb; z-index:5; }
  .scissors { position:absolute; z-index:6; font-size:44px; color:#999; background:#fff; padding:2px 8px; border-radius:8px; }
  .s1 { left:calc(50% - 30px); top:16px; }
  .s2 { top:calc(50% - 30px); left:16px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><img src="A5-flyer-customer.png"></div>
    <div class="cell"><img src="A5-flyer-customer.png"></div>
    <div class="cell"><img src="A5-flyer-customer.png"></div>
    <div class="cell"><img src="A5-flyer-customer.png"></div>
  </div>
  <div class="cut-v"></div>
  <div class="cut-h"></div>
  <div class="scissors s1">✂️</div>
  <div class="scissors s2">✂️</div>
</body>
</html>
