<!doctype html><meta charset="utf-8">
<!-- 🏗️ إعلان «YM — تشطيبات متكاملة» (١٧/٩/٢٠٢٦) — صور يوسف محسن الحقيقية بحركة بطيئة + هوية الذهبي/الفضي من اللوجو.
     مفيش أي رقم أو وعد مش من صاحب الشغل (مفيش سعر متر ولا مدة تسليم ولا ضمان). -->
<style>
@font-face{font-family:T;src:url(file:///E:/madmona-app/scripts/reels/fonts/Tajawal-Black.ttf)}
@font-face{font-family:TB;src:url(file:///E:/madmona-app/scripts/reels/fonts/Tajawal-Bold.ttf)}
@font-face{font-family:TM;src:url(file:///E:/madmona-app/scripts/reels/fonts/Tajawal-Medium.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0B0B0B;direction:rtl}
#stage{position:fixed;inset:0;overflow:hidden;background:#0B0B0B;contain:strict}
.ph{position:absolute;inset:0;overflow:hidden}
.ph img{position:absolute;left:50%;top:50%;width:1080px;height:1920px;object-fit:cover;transform-origin:center;will-change:transform;filter:brightness(1.12) contrast(1.05) saturate(1.05)}
.vig{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,11,.85) 0%,rgba(11,11,11,.06) 30%,rgba(11,11,11,.10) 58%,rgba(11,11,11,.88) 100%)}
.hd{position:absolute;right:80px;left:80px;top:250px;font-family:T;font-size:104px;line-height:1.1;color:#fff;text-align:center;text-shadow:0 6px 34px rgba(0,0,0,.85)}
.sub{position:absolute;right:90px;left:90px;bottom:300px;font-family:TB;font-size:56px;line-height:1.3;color:#F2E9D8;text-align:center;text-shadow:0 4px 24px rgba(0,0,0,.9)}
.chip{position:absolute;right:0;left:0;bottom:200px;text-align:center}
.chip span{display:inline-block;font-family:TB;font-size:46px;color:#0B0B0B;background:linear-gradient(135deg,#E6C478,#C9A227);padding:16px 40px;border-radius:999px}
.rule{position:absolute;left:50%;transform:translateX(-50%);height:5px;background:linear-gradient(90deg,transparent,#C9A227,transparent);border-radius:3px}
.brand{position:absolute;top:96px;right:0;left:0;text-align:center;font-family:TB;font-size:38px;letter-spacing:6px;color:#C9A227;opacity:.9}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;background:radial-gradient(700px 700px at 50% 38%,#191919,#0B0B0B)}
.card img{width:560px;height:560px;object-fit:contain;border-radius:32px}
.gold{font-family:T;font-size:76px;background:linear-gradient(135deg,#F0D79A,#C9A227);-webkit-background-clip:text;background-clip:text;color:transparent}
.wa{font-family:TB;font-size:48px;color:#0B0B0B;background:#E6C478;padding:20px 48px;border-radius:999px}
.bar{position:absolute;left:0;bottom:0;height:10px;background:linear-gradient(90deg,#C9A227,#E6C478)}
</style>
<div id="stage"></div>
<script>
const P = 'file:///E:/madmona-app/scripts/reels/clients/ym/src/'
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), eo=x=>1-Math.pow(1-cl(x),3)
// المشاهد: صورة + عنوان + شارة. التوقيت بيتظبط على وقفات صوت بهجت (window.B)
const S = [
  { img:null,                 hd:'شقة على الطوب الأحمر؟', sub:'وكل واحد بيقولّك حاجة' },
  { img:'05-corridor.jpg',    hd:'التشطيب مش سيراميك ودهان', sub:'ده اللي هتعيش فيه سنين', chip:'تشطيبات متكاملة' },
  { img:'04-hall2.jpg',       hd:'جبس وإضاءة مخفية',        sub:'تحسّ بيها… ومش شايفها', chip:'أسقف وإضاءة' },
  { img:'07-entrance-door.jpg', hd:'أبواب بزاوية مظبوطة',   sub:'تشطيب ما بيبانش فيه أثر شغل', chip:'أبواب وتشطيب' },
  { img:'03-bath.jpg',        hd:'حمام كامل',               sub:'تدخله تستخدمه على طول', chip:'سباكة وكهرباء' },
  { img:'01-youssef.jpg',     hd:'يوسف محسن',               sub:'صاحب الشغل — واقف عليه بنفسه', chip:'YM' },
  { logo:true }
]
window.B = window.B || [0, 3.75, 8.3, 12.25, 17.0, 20.5, 25.0, 33.8]  // متزامن مع صوت بهجت (vo.mp3)
window.PHONE = window.PHONE || ''
const stage = document.getElementById('stage')
const sceneAt = t => { const B=window.B; let i=0; while(i<S.length-1 && t>=B[i+1]) i++; return [i, t-B[i], B[i+1]-B[i]] }
window.render = t => {
  const [i, lt, dur] = sceneAt(t), s = S[i]
  const inF = cl(lt/0.5), outF = cl((dur-lt)/0.5)
  let html = ''
  if (s.logo) {
    const k = 0.92 + 0.08*eo(lt/0.8)
    html += `<div class="card" style="opacity:${inF}">
      <img src="${P}logo.jpg" style="transform:scale(${k})">
      <div class="gold">تشطيبات متكاملة</div>
      <div style="font-family:TM;font-size:52px;color:#CFC6B4;letter-spacing:10px">جـودة تـدوم</div>
      ${window.PHONE ? `<div class="wa" style="direction:ltr">📱 ${window.PHONE}</div>` : `<div class="wa">ابعت صورة شقتك على واتساب</div>`}
    </div>`
  } else {
    const z = 1.06 + 0.10*(lt/dur), pan = (i%2? -1:1) * 26 * (lt/dur)
    html += `<div class="ph" style="opacity:${Math.min(inF,outF)}">`
    html += s.img ? `<img src="${P}${s.img}" style="transform:translate(-50%,-50%) scale(${z.toFixed(3)}) translateX(${pan.toFixed(1)}px)">`
                  : `<div style="position:absolute;inset:0;background:radial-gradient(800px 800px at 50% 40%,#1b1b1b,#0B0B0B)"></div>`
    html += `<div class="vig"></div>
      <div class="brand">Y M</div>
      <div class="hd" style="transform:translateY(${(1-eo(lt/0.6))*40}px);opacity:${cl(lt/0.5)}">${s.hd}</div>
      <div class="rule" style="top:420px;width:${420*eo((lt-0.3)/0.7)}px"></div>
      <div class="sub" style="opacity:${cl((lt-0.5)/0.5)}">${s.sub}</div>
      ${s.chip ? `<div class="chip" style="opacity:${cl((lt-0.9)/0.4)};transform:scale(${0.9+0.1*eo((lt-0.9)/0.5)})"><span>${s.chip}</span></div>` : ''}
    </div>`
  }
  const total = window.B[S.length]
  html += `<div class="bar" style="width:${(t/total)*100}%"></div>`
  stage.innerHTML = html
}
window.render(0)
</script>
