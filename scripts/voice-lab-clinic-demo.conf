; ============================================================================
; 🧪 (٢٨ أغسطس ٢٠٢٦) نموذج تجريبي — قائمة العيادات الصوتية
;
; محمد: «اشتغل من غير أي API، وريني نموذج تجريبي لو نجح هسجل بصوتي».
;
; 💰 صفر استهلاك API — أصوات أستريسك المجانية المدمجة.
; 🎯 الهدف: نختبر **المنطق** (الضغط على الأرقام · التكرار · التحويل ·
;    تسجيل الطلب) قبل ما محمد يتعب في التسجيل.
;    الأصوات إنجليزية مؤقتًا — بتتبدل بتسجيله بعد النجاح.
;
; خريطة الأصوات المؤقتة → النهائية:
;   hello-world      → md-clinic-welcome   (الترحيب والاختيارات)
;   demo-thanks      → md-clinic-listings  (عيادات معروضة)
;   auth-thankyou    → md-clinic-list      (اعرض عيادتك)
;   pbx-transfer     → md-transfer         (تحويل للفريق)
;   demo-thanks      → md-callback         (سجّلنا رقمك)
;   invalid          → md-invalid          (رقم غلط)
;   please-try-again → md-no-input         (ما سمعتش)
; ============================================================================

[incoming-mobile]
exten => s,1,NoOp(📞 مكالمة من ${CALLERID(num)} — نموذج العيادات)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Set(TIMEOUT(digit)=5)
 same => n,Set(TIMEOUT(response)=10)
 same => n,Goto(clinic-menu,s,1)

[clinic-menu]
exten => s,1,Set(TRIES=0)
 same => n(top),Set(TRIES=$[${TRIES}+1])
 same => n,NoOp(محاولة ${TRIES})
 same => n,GotoIf($[${TRIES}>3]?transfer,s,1)
 ; 🔊 الترحيب + نطق الاختيارات بأرقام (عشان نتأكد إن الضغط شغال)
 same => n,Background(hello-world)
 same => n,Background(digits/1)
 same => n,Background(digits/2)
 same => n,Background(digits/3)
 same => n,WaitExten(8)

exten => 1,1,Goto(clinic-listings,s,1)
exten => 2,1,Goto(clinic-list-yours,s,1)
exten => 3,1,Goto(transfer,s,1)
exten => 0,1,Goto(transfer,s,1)
exten => i,1,Playback(invalid)
 same => n,Goto(clinic-menu,s,top)
exten => t,1,Playback(please-try-again)
 same => n,Goto(clinic-menu,s,top)

; ① عيادات معروضة للبيع (٨ إعلانات فعلية — التجمع والعاصمة)
[clinic-listings]
exten => s,1,NoOp(✅ اختار 1 — عيادات معروضة)
 same => n,Playback(digits/1)
 same => n,Playback(demo-thanks)
 same => n,System(/usr/local/bin/log_callback.sh "${CALLERID(num)}" "clinic-listings")
 same => n,Playback(goodbye)
 same => n,Hangup()

; ② صاحب عيادة عايز يعرض
[clinic-list-yours]
exten => s,1,NoOp(✅ اختار 2 — عايز يعرض عيادة)
 same => n,Playback(digits/2)
 same => n,Playback(auth-thankyou)
 same => n,System(/usr/local/bin/log_callback.sh "${CALLERID(num)}" "clinic-list-yours")
 same => n,Playback(goodbye)
 same => n,Hangup()

; ③ تحويل للفريق — الخط الواحد مايقدرش يحوّل، فبنسجّل الطلب
[transfer]
exten => s,1,NoOp(✅ اختار 3 — تحويل للفريق)
 same => n,Playback(pbx-transfer)
 same => n,System(/usr/local/bin/log_callback.sh "${CALLERID(num)}" "clinic-transfer")
 same => n,Playback(demo-thanks)
 same => n,Playback(goodbye)
 same => n,Hangup()
